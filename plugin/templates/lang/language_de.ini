# Deutsche Texte der Weboberfläche. Fehlt ein Eintrag, nimmt LoxBerry den englischen.
# %s / %d werden von der Seite ersetzt.

[UI]
TITLE=Hargassner Heizung
NAV_VALUES=Werte
NAV_SETTINGS=Einstellungen
NAV_BACKUP=Sicherung
NAV_LOG=Log
DATE_FORMAT=d.m.Y H:i:s
AGE_SECONDS=vor %d s
AGE_MINUTES=vor %d min
AGE_HOURS=vor %d h

STATUS=Status
BRIDGE_SERVICE=Bridge-Dienst
RUNNING=läuft
STOPPED=gestoppt
STARTING=Bridge startet – Status folgt in wenigen Sekunden.
SOURCE=Datenquelle
HEATING=Daten der Heizung
DATA_OK=kommen an
NO_DATA=keine Daten
MQTT_BROKER=MQTT-Broker
CONNECTED=verbunden
NOT_CONNECTED=nicht verbunden
LAST_FRAME=Letzter gültiger Datensatz
FIELD_COUNT=Werte pro Datensatz
FIELD_COUNT_LEARNING=wird ermittelt …
FRAMES=Datensätze seit Start
FRAMES_TEXT=%d gültig, %d verworfen
LAST_REJECTED=Zuletzt verworfen: Datensatz mit %d Werten – Übertragungsfehler oder fehlende Startkennung „pm“
BTN_RESTART=Neu starten
BTN_STOP=Stoppen
LEGACY_SERVICE=Achtung: Der alte, von Hand eingerichtete Dienst hargassner.service läuft noch und liest ebenfalls die Schnittstelle. Bitte per SSH abschalten: sudo systemctl disable --now hargassner.service

VALUES=Werte und Feldnamen
VALUES_HINT=Live-Werte der Heizung, alle 2 s aktualisiert. Geänderte Werte blinken kurz, die Zahl daneben zählt die Änderungen – so lässt sich herausfinden, welcher Index zu welcher Anzeige der Heizung gehört. Per MQTT gesendet werden nur Werte mit Namen; welche davon an den Miniserver gehen, entscheidet das MQTT Gateway. Bitmasken wie Pumpen oder Störlampe bekommen je Bit eine eigene Zeile mit 0/1, Änderungszähler und Namensfeld; angezeigt werden Bits, die benannt sind oder seit dem Öffnen der Seite 1 waren. Gesendet werden die benannten Bits. Hargassner sendet Digitalwerte immer hexadezimal, z. B. ff1, ffff oder 5c; bis zu 32 Bits.
NO_VALUES_YET=Noch keine Daten von der Heizung. Die Tabelle erscheint, sobald der erste gültige Datensatz angekommen ist – Verbindung unter „Einstellungen“ prüfen.
ONLY_NAMED=nur benannte Felder
ONLY_CHANGED=nur geänderte Werte
SHOW_ALL_BITS=alle Bits zeigen
BIT=Bit
RESET_CHANGES=Änderungszähler zurücksetzen
COL_VALUE=Wert
COL_NAME=Name
COL_TYPE=Typ
COL_BITS=Bits
COL_TOPIC=MQTT-Topics
NOT_SENT=nicht gesendet – Name vergeben
TYPE_VALUE=Wert
TYPE_HEX=Bitmaske (hex)
SAVE_FIELDS=Feldnamen speichern und Bridge neu starten
STATUS_TOPICS=Zustand der Bridge: %s – 1 = Daten kommen an – und %s – Fehlertext oder OK.
GATEWAY_HINT=Damit die Werte im Miniserver ankommen, muss das MQTT Gateway des LoxBerry das Topic abonniert haben, z. B. %s.

ENABLED=Bridge aktiviert
CONNECTION=Verbindung zur Heizung
SOURCE_TYPE=Datenquelle
SOURCE_SERIAL=Serielle Schnittstelle (USB-Adapter)
SOURCE_TCP=Netzwerk (Seriell-Ethernet-Wandler)
SERIAL_DEVICE=Schnittstelle
SERIAL_DEVICE_HINT=Empfohlen: der Name unter /dev/serial/by-id/ – er bleibt gleich, auch wenn weitere USB-Geräte angesteckt werden. /dev/ttyUSB0 kann sich dann ändern.
SERIAL_FOUND=Gefunden:
SERIAL_NONE=Keine serielle Schnittstelle gefunden.
BAUDRATE=Baudrate – Hargassner: meist 19200, ältere Steuerungen 9600
TCP_HOST=IP-Adresse des Wandlers
TCP_PORT=Port
TCP_HINT=Den Wandler, z. B. Waveshare RS232/485 TO ETH, auf „TCP Server“ und die gleichen Schnittstellenwerte wie die Heizung stellen: 19200 Baud, 8 Datenbits, keine Parität, 1 Stoppbit. Waveshare verwendet standardmäßig Port 4196.
DATA_TIMEOUT=Verbindung neu aufbauen, wenn so viele Sekunden keine gültigen Daten kommen
EXPECTED_FIELDS=Erwartete Anzahl Werte pro Datensatz – 0 = automatisch
EXPECTED_FIELDS_HINT=Datensätze mit anderer Länge werden verworfen, damit Werte nie auf einem falschen Index landen. Automatisch: die Länge wird nach 3 gleich langen Datensätzen übernommen und passt sich nach einem Firmware-Update der Heizung selbst an.

MQTT=MQTT
BASE_TOPIC=Basis-Topic
CLEANUP=Beim Start verwaiste Topics löschen, z. B. umbenannte oder gelöschte Felder
REPUBLISH=Alle Werte erneut senden alle … Sekunden – 0 = nie
REPUBLISH_HINT=Sonst wird ein Wert nur gesendet, wenn er sich ändert. Das entlastet Broker, MQTT Gateway und Miniserver.
USE_LOXBERRY=Broker-Zugangsdaten des LoxBerry verwenden – empfohlen
BROKER_HOST=Broker-Host
BROKER_PORT=Port
BROKER_USER=Benutzer
BROKER_PASSWORD=Passwort
PASSWORD_SAVED=– gespeichert, leer lassen, um es beizubehalten
LOGGING=Protokoll
SAVE_SETTINGS=Speichern und Bridge neu starten

BACKUP_EXPORT=Einstellungen sichern
BACKUP_EXPORT_HINT=Lädt alle Einstellungen und Feldnamen als JSON-Datei herunter. Mit dieser Datei ist das Plugin nach einer Neuinstallation – oder auf einem anderen LoxBerry – sofort wieder eingerichtet.
BTN_EXPORT=Sicherung herunterladen
BACKUP_CONTENT=Enthält %d benannte Felder. Das Passwort eines eigenen MQTT-Brokers wird nicht gesichert.
BACKUP_IMPORT=Sicherung einspielen
BACKUP_IMPORT_HINT=Akzeptiert Sicherungen dieses Plugins, die Konfigurationsdatei hargassner.json und die Datei hargassner_mapping.json der früheren Skripte.
IMPORT_FIELDS=Feldnamen und Bitmasken übernehmen
IMPORT_SETTINGS=Einstellungen übernehmen: Verbindung, MQTT, …
IMPORT_SETTINGS_HINT=Beim Umzug vom LoxBerry an der Heizung auf einen zentralen LoxBerry mit Netzwerk-Wandler: nur Feldnamen übernehmen und die Verbindung danach unter „Einstellungen“ eintragen.
BTN_IMPORT=Einspielen und Bridge neu starten

[MSG]
SETTINGS_SAVED=Einstellungen gespeichert.
FIELDS_SAVED=Feldnamen gespeichert.
SAVE_FAILED=Fehler: Die Einstellungen konnten nicht gespeichert werden.
NOT_SAVED=Nicht gespeichert:
NAME_INVALID=Der Name „%s“ bei %s ist nicht erlaubt – er braucht Buchstaben oder Ziffern und darf nicht bridge heißen.
NAME_DUPLICATE=Der Name „%s“ bei %s ergibt dasselbe Topic wie %s.
TCP_HOST_MISSING=Bitte die IP-Adresse des Wandlers eintragen.
RESTARTED=Die Bridge wurde neu gestartet.
STOPPED=Die Bridge wurde gestoppt.
STOP_FAILED=Die Bridge konnte nicht gestoppt werden.
REASON_DISABLED=Die Bridge ist in den Einstellungen deaktiviert.
REASON_UNKNOWN=Die Bridge läuft nicht – Details im Log.
IMPORTED=Sicherung eingespielt:
IMPORT_FIELDS=%d Felder
IMPORT_SETTINGS=Einstellungen
IMPORT_NOTHING=Die Datei enthält nichts von dem, was übernommen werden soll.
IMPORT_NO_FILE=Bitte eine Datei auswählen.
IMPORT_TOO_BIG=Die Datei ist zu groß – maximal 1 MB.
IMPORT_NO_JSON=Die Datei ist keine gültige JSON-Datei.
IMPORT_TOO_NEW=Die Sicherung stammt von einer neueren Plugin-Version – bitte zuerst das Plugin aktualisieren.
IMPORT_UNKNOWN=Unbekanntes Dateiformat – erwartet wird eine Sicherung dieses Plugins.
