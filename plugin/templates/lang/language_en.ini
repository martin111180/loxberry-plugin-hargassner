# English texts of the web interface (fallback for all languages without their own file).
# %s / %d are replaced by the page.

[UI]
TITLE=Hargassner heating
NAV_VALUES=Values
NAV_SETTINGS=Settings
NAV_BACKUP=Backup
NAV_LOG=Log
DATE_FORMAT=Y-m-d H:i:s
AGE_SECONDS=%d s ago
AGE_MINUTES=%d min ago
AGE_HOURS=%d h ago

STATUS=Status
BRIDGE_SERVICE=Bridge service
RUNNING=running
STOPPED=stopped
STARTING=Bridge is starting – status follows in a few seconds.
SOURCE=Data source
HEATING=Data from the boiler
DATA_OK=arriving
NO_DATA=no data
MQTT_BROKER=MQTT broker
CONNECTED=connected
NOT_CONNECTED=not connected
LAST_FRAME=Last valid record
FIELD_COUNT=Values per record
FIELD_COUNT_LEARNING=detecting …
FRAMES=Records since start
FRAMES_TEXT=%d valid, %d rejected
LAST_REJECTED=Last rejected: record with %d values – transmission error or missing start marker “pm”
BTN_RESTART=Restart
BTN_STOP=Stop
LEGACY_SERVICE=Warning: the old, manually created service hargassner.service is still running and reads the same port. Please disable it via SSH: sudo systemctl disable --now hargassner.service

VALUES=Values and field names
VALUES_HINT=Live values of the boiler, updated every 2 s. Changed values flash briefly and the counter next to them counts the changes – this shows which index belongs to which display value of the boiler. Only values with a name are sent via MQTT; the MQTT Gateway decides which of them go to the Miniserver. Bit masks such as pumps or the fault lamp are split into single bits and the named bits are sent; Hargassner usually sends them as hexadecimal, e.g. ff1 or ffff.
NO_VALUES_YET=No data from the boiler yet. The table appears as soon as the first valid record has arrived – check the connection under “Settings”.
ONLY_NAMED=named fields only
ONLY_CHANGED=changed values only
RESET_CHANGES=reset change counters
COL_VALUE=Value
COL_NAME=Name
COL_TYPE=Type
COL_BITS=Bits / bit names
COL_TOPIC=MQTT topics
NOT_SENT=not sent – give it a name
TYPE_VALUE=Value
TYPE_HEX=Bit mask hex
TYPE_DEC=Bit mask decimal
BITS_PLACEHOLDER=7: fault lamp, 4: pump HC1
SAVE_FIELDS=Save field names and restart bridge
STATUS_TOPICS=Bridge state: %s – 1 = data arriving – and %s – error text or OK.
GATEWAY_HINT=For the values to reach the Miniserver, the LoxBerry MQTT Gateway must subscribe to the topic, e.g. %s.

ENABLED=Bridge enabled
CONNECTION=Connection to the boiler
SOURCE_TYPE=Data source
SOURCE_SERIAL=Serial port (USB adapter)
SOURCE_TCP=Network (serial-to-Ethernet converter)
SERIAL_DEVICE=Port
SERIAL_DEVICE_HINT=Recommended: the name below /dev/serial/by-id/ – it stays the same when more USB devices are plugged in. /dev/ttyUSB0 may change then.
SERIAL_FOUND=Found:
SERIAL_NONE=No serial port found.
BAUDRATE=Baud rate – Hargassner: usually 19200, older controllers 9600
TCP_HOST=IP address of the converter
TCP_PORT=Port
TCP_HINT=Set the converter, e.g. Waveshare RS232/485 TO ETH, to “TCP Server” with the same serial settings as the boiler: 19200 baud, 8 data bits, no parity, 1 stop bit. Waveshare uses port 4196 by default.
DATA_TIMEOUT=Reconnect if no valid data arrives for this many seconds
EXPECTED_FIELDS=Expected number of values per record – 0 = automatic
EXPECTED_FIELDS_HINT=Records of a different length are rejected so values never end up on a wrong index. Automatic: the length is taken after 3 records of equal length and adapts itself after a firmware update of the boiler.

MQTT=MQTT
BASE_TOPIC=Base topic
CLEANUP=Delete orphaned topics on start, e.g. renamed or removed fields
REPUBLISH=Resend all values every … seconds – 0 = never
REPUBLISH_HINT=Otherwise a value is only sent when it changes. This keeps the load off broker, MQTT Gateway and Miniserver.
USE_LOXBERRY=Use the LoxBerry broker credentials – recommended
BROKER_HOST=Broker host
BROKER_PORT=Port
BROKER_USER=User
BROKER_PASSWORD=Password
PASSWORD_SAVED=– saved, leave empty to keep it
LOGGING=Logging
SAVE_SETTINGS=Save and restart bridge

BACKUP_EXPORT=Back up settings
BACKUP_EXPORT_HINT=Downloads all settings and field names as a JSON file. With this file the plugin is set up again right away after a reinstall – or on another LoxBerry.
BTN_EXPORT=Download backup
BACKUP_CONTENT=Contains %d named fields. The password of a custom MQTT broker is not included.
BACKUP_IMPORT=Restore backup
BACKUP_IMPORT_HINT=Accepts backups of this plugin, the configuration file hargassner.json and the file hargassner_mapping.json of the earlier scripts.
IMPORT_FIELDS=Restore field names and bit masks
IMPORT_SETTINGS=Restore settings: connection, MQTT, …
IMPORT_SETTINGS_HINT=When moving from the LoxBerry at the boiler to a central LoxBerry with a network converter: restore only the field names and enter the connection under “Settings” afterwards.
BTN_IMPORT=Restore and restart bridge

[MSG]
SETTINGS_SAVED=Settings saved.
FIELDS_SAVED=Field names saved.
SAVE_FAILED=Error: the settings could not be saved.
NOT_SAVED=Not saved:
NAME_INVALID=The name “%s” at %s is not allowed – it needs letters or digits and must not be bridge.
NAME_DUPLICATE=The name “%s” at %s results in the same topic as %s.
TCP_HOST_MISSING=Please enter the IP address of the converter.
RESTARTED=The bridge was restarted.
STOPPED=The bridge was stopped.
STOP_FAILED=The bridge could not be stopped.
REASON_DISABLED=The bridge is disabled in the settings.
REASON_UNKNOWN=The bridge is not running – see the log for details.
IMPORTED=Backup restored:
IMPORT_FIELDS=%d fields
IMPORT_SETTINGS=settings
IMPORT_NOTHING=The file contains nothing of what should be restored.
IMPORT_NO_FILE=Please choose a file.
IMPORT_TOO_BIG=The file is too large – max. 1 MB.
IMPORT_NO_JSON=The file is not a valid JSON file.
IMPORT_TOO_NEW=The backup comes from a newer plugin version – please update the plugin first.
IMPORT_UNKNOWN=Unknown file format – expected a backup of this plugin.
